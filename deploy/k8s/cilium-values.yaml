# Cilium 1.20.4 for the single-node cluster.
#   helm install cilium cilium --repo https://helm.cilium.io --version 1.20.4 \
#     --namespace kube-system -f deploy/k8s/cilium-values.yaml

# Replaces kube-proxy (kubeadm skips installing it).
kubeProxyReplacement: "true"

# Without kube-proxy, Cilium must find the API server itself. "auto" reads it
# from kubeadm's cluster-info ConfigMap, so the node IP lives nowhere in this repo.
k8sServiceHost: auto
k8sServicePort: "6443" # kubeadm's default API server port

ipam:
  mode: cluster-pool
  operator:
    # The chart default is 10.0.0.0/8, which is wide enough to collide with
    # other private networks. A /16 is plenty for one node.
    clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]

operator:
  # The default of 2 replicas would leave one Pending on a single node.
  replicas: 1
