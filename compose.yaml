# Early local stack. Only the Lightpath web app exists so far; the Worker runs with
# `wrangler dev` (phase 4) and the probe runs on the host, not in a container
# (phase 7), because it reads host devices and the journal.
#
#   cp .env.example .env    # then fill in SECRET_KEY_BASE
#   docker compose up --build
#   open http://127.0.0.1:4100   (LIGHTPATH_PORT in .env changes it)

name: lightpath

services:
  lightpath:
    build:
      context: ./lightpath
    image: lightpath:dev
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (mix phx.gen.secret)}
      PHX_HOST: ${PHX_HOST:-localhost}
      # One variable sets both the app's listen port and the host mapping.
      PORT: ${LIGHTPATH_PORT:-4100}
      # The evidence page shows the newest set under this directory.
      LIGHTPATH_FIXTURES_ROOT: /fixtures
    volumes:
      # Public (scrubbed) fixtures only; raw output never enters the container.
      - ./fixtures/public:/fixtures:ro
    ports:
      # Loopback only; nothing is exposed to the LAN until we decide to.
      - "127.0.0.1:${LIGHTPATH_PORT:-4100}:${LIGHTPATH_PORT:-4100}"
    # Hardening: the release needs no writes outside /tmp and no capabilities.
    # cap_drop ALL is the strict option: if something fails with "operation not
    # permitted", suspect this first and add back only the capability it needs.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
